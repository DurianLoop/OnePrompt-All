schema_version: adapromptset.phase3.glas_region_bank.v1
date: 2026-07-19
scope: GlaS automatic region prompt feasibility
statistical_unit: query_image
frozen_inputs:
  matcher: DINOv2-L
  segmenter_primary: SAM-B
  phase2_gate_c_candidate_generator: local_peaks_redesign_v1
  phase2_query_manifest: manifests/phase2/glas/episodes_val.csv
  phase3_internal_references: manifests/phase3/glas_region_references.csv
aggregation:
  E1_mean:
    description: mean over normalized per-reference evidence maps
    selectable_on: 40_15_internal_only
  E2_max:
    description: max over normalized per-reference evidence maps
    selectable_on: 40_15_internal_only
parameter_grid:
  contrast_quantile: [0.70, 0.80, 0.90]
  min_component_area_ratio: [0.001, 0.005]
  closing_radius: [0, 3, 5]
  soft_logit_temperature: [5, 10]
  top_component_count: [1, 3]
selection_rule:
  pool: 40_calibration_then_15_internal_selection
  metric: region proposal quality for R1; SAM Dice for R2 only after R1 pass
  tie_break: if absolute metric difference is below 0.005 choose lower-cost simpler config
  strict_validation_parameter_selection: prohibited
actions:
  R00_direct_matching_mask:
    type: direct_mask
    sam_calls: 0
    automatic: true
    role: raw_matching_quality
  R01_full_image_box:
    type: box
    sam_calls: 1
    automatic: true
    role: trivial_control
  R02_size_matched_random_box:
    type: box
    sam_calls: 1
    automatic: true
    role: matched_control
    seed: 20260719
  R03_automatic_union_box:
    type: box
    sam_calls: 1
    automatic: true
    proposal: thresholded_matching_mask_union_box
  R04_automatic_largest_component_box:
    type: box
    sam_calls: 1
    automatic: true
    proposal: thresholded_matching_mask_largest_component_box
  R05_automatic_top3_component_boxes:
    type: box_set
    sam_calls_max: 3
    automatic: true
    proposal: thresholded_matching_mask_top3_component_boxes
    fusion: binary_union
  R06_automatic_hard_mask_prompt:
    type: mask_prompt
    sam_calls: 1
    automatic: true
    proposal: thresholded_matching_mask
  R07_automatic_soft_logit_mask_prompt:
    type: soft_mask_prompt
    sam_calls: 1
    automatic: true
    proposal: normalized_contrast_map_fixed_temperature_logits
  R08_automatic_largest_box_plus_soft_mask:
    type: hybrid_box_soft_mask
    sam_calls: 1
    automatic: true
    proposal: R04_box_plus_R07_soft_mask
  R09_frozen_matching_top_point_baseline:
    type: point
    sam_calls: 1
    automatic: true
    role: automatic_point_baseline
    source: frozen_gate_c_redesign_candidates
upper_bounds:
  U01_gt_union_box_upper_bound:
    type: box
    sam_calls: 1
    automatic: false
    privileged: true
  U02_gt_component_boxes_upper_bound:
    type: box_set
    sam_calls_max: 3
    automatic: false
    privileged: true
  U03_degraded_gt_coarse_mask_upper_bound:
    type: mask_prompt
    sam_calls: 1
    automatic: false
    privileged: true
prohibited:
  - strict_validation_parameter_selection
  - query_gt_for_automatic_proposal
  - testA_testB_access
  - new_matcher
  - new_candidate_generator
  - posthoc_region_action_addition
  - per_query_threshold_tuning
